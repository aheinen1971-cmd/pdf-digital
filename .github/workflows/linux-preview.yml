name: PDF Digital Linux preparation
on:
  push:
    branches: [linux-preparation]
permissions:
  contents: read
concurrency:
  group: pdf-digital-linux-preparation
  cancel-in-progress: false
jobs:
  package-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare native Linux desktop libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3.12-venv xvfb libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 fonts-dejavu-core fonts-liberation
          python3.12 -m venv /tmp/pdf-builder
      - name: Build offline test package
        run: /tmp/pdf-builder/bin/python linux/build_package.py
      - name: Install and test extracted package in a path with spaces
        run: |
          mkdir -p '/tmp/PDF Digital Test'
          tar -xzf dist/PDF-Digital-Linux-Test.tar.gz -C '/tmp/PDF Digital Test'
          cd '/tmp/PDF Digital Test/PDF-Digital-Linux-Test'
          ./install.sh
          xvfb-run -a .venv/bin/python app/linux/run_tests.py "$GITHUB_WORKSPACE/test-reports"
      - name: Preserve evidence and test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-digital-linux-preparation
          path: |
            test-reports/
            dist/*.tar.gz
          retention-days: 7
